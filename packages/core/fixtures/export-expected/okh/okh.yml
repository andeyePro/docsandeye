okhv: OKH-LOSHv1.0
name: AEP0.2 build guide
repo: https://github.com/amy-bo/electroPioreactor
version: 0.2.0
license:
  hardware: CERN-OHL-S-2.0
licensor: AMYBO
description: An open aseptic electro-bioreactor add-on for the Pioreactor.
function: Grows hydrogen-oxidising bacteria under in-culture electrolysis.
documentation-home: https://docs.electroPioreactor.org/AEP
documentation-language: en
bom:
  - name: MMO anode (titanium mesh)
    id: anode-mmo
    quantity: 1
    category: part
  - name: Electrode Top Stop
    id: electrode-top-stop
    quantity: 1
    category: printed
    license: CC-BY-SA-4.0
    source: Components/ElectrodeTopStop/ElectrodeTopStop.scad
  - name: Lid Assembly
    id: lid-assembly
    quantity: 1
    category: prev
    source: Assemblies/Lid/Lid.f3z
    export:
      - Assemblies/Lid/Lid v3.step
      - Assemblies/Lid/Lid v3.stl
  - name: Vernier callipers
    id: vernier-callipers
    quantity: 1
    category: tool
  - name: Vial Cap (2×6.1 mm + 5×3.2 mm ports)
    id: vial-cap-2x6.1-5x3.2
    quantity: 2
    category: printed
    license: CC-BY-SA-4.0
    source: Components/Vial Cap/Vial Cap.scad
    export:
      - Components/Vial Cap/2x6.1 + 5x3.2mm ports/Vial Cap 2x6.1 + 5x3.2 v2.stl
manufacturing-files:
  - Assemblies/Lid/Lid v3.step
  - Assemblies/Lid/Lid v3.stl
  - Components/Vial Cap/2x6.1 + 5x3.2mm ports/Vial Cap 2x6.1 + 5x3.2 v2.stl
