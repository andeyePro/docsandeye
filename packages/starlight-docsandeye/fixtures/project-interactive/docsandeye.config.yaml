theme: starlight
project: {repo: "https://github.com/example/kit", branch: dev}
guides:
  - {id: kit, title: "Kit guide", base: /kit}
  - {id: other, title: "Other guide", base: /other}
profile:
  - id: build
    type: choice
    label: "Which kit are you building?"
    options:
      - {value: full, label: "Full kit (temperature upgrade included)", implies: {temp-kit: true}}
      - {value: basic, label: "Basic kit", implies: {temp-kit: false}}
      - {value: custom, label: "Custom build: I will say what I have"}
      - {value: other, label: "Another kit: use the other guide", href: /other/}
    default: custom
  - id: units
    type: number
    label: "How many units did you receive?"
    unit_label: unit
    unit_label_plural: units
    default: 1
    min: 1
    max: 20
  - id: temp-kit
    type: boolean
    label: "Do you have the temperature upgrade?"
    short: "temperature upgrade"
    guides: [kit]
    default: false
  - id: supplier
    type: choice
    label: "Where did your parts come from?"
    options:
      - {value: shop-a, label: "Shop A kit"}
      - {value: shop-b, label: "Shop B"}
      - {value: diy, label: "Sourced myself from [the BoM](https://bom.example/list)"}
    default: shop-a
  - id: colour
    type: choice
    label: "Which colour is your case?"
    guides: [other]
    options:
      - {value: red, label: "Red case"}
      - {value: blue, label: "Blue case"}
receipt:
  multiply_by: units
  supplier_from: supplier
contacts:
  shop-a: {name: "Shop A", email: "support@shop-a.invalid", subject: "Missing parts: kit order"}
  shop-b: {name: "Shop B"}
  project: {name: "The project", email: "help@project.invalid", subject: "Kit guide: help with a step"}
